services:
    db:
        image: postgres:15-alpine
        container_name: qms_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-qms_db}
            POSTGRES_USER: ${DB_USERNAME:-qms_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qms_user} -d ${DB_DATABASE:-qms_db}"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: qms_backend
        restart: unless-stopped
        working_dir: /var/www
        volumes:
            - ./backend:/var/www
        depends_on:
            db:
                condition: service_healthy

    nginx:
        image: nginx:alpine
        container_name: qms_nginx
        restart: unless-stopped
        ports:
            - "8000:80"
        volumes:
            - ./backend:/var/www
            - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - backend

    frontend:
        image: node:20-alpine
        container_name: qms_frontend
        working_dir: /app
        volumes:
            - ./frontend:/app
        ports:
            - "3000:3000"
        command: sh -c "npm install && npm run dev -- --host"

volumes:
    pgdata: