services:
    db:
        image: postgres:15-alpine
        container_name: qms_db
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-qms_db}
            POSTGRES_USER: ${DB_USERNAME:-qms_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-qms_user} -d ${DB_DATABASE:-qms_db}"]
            interval: 5s
            timeout: 5s
            retries: 10

    backend:
        build:
            context: ./backend/
            dockerfile: Dockerfile
            network: host
        container_name: qms_backend
        restart: unless-stopped
        entrypoint: ["/usr/local/bin/entrypoint.sh"]
        command: ["php-fpm"]
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: db
            DB_PORT: 5432
            DB_DATABASE: ${DB_DATABASE:-qms_db}
            DB_USERNAME: ${DB_USERNAME:-qms_user}
            DB_PASSWORD: ${DB_PASSWORD:-secret}
        working_dir: /var/www
        volumes:
            - ./backend:/var/www
            - backend_vendor:/var/www/vendor
            - backend_storage:/var/www/storage
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 40s 

    nginx:
        image: nginx:alpine
        volumes:
            - ./backend:/var/www
            - ./backend/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            backend:
                condition: service_healthy
        healthcheck:
          test: "curl --silent --fail http://localhost/ > /dev/null || exit 1"          
          interval: 5s
          timeout: 5s
          retries: 20

    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
            args:
                VITE_API_URL: /api
        container_name: qms_frontend
        ports:
            - "3001:80"          
        depends_on:
            nginx:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 20
            start_period: 10s

volumes:
    pgdata:
    backend_vendor:
    backend_storage: