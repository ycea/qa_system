name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Pint + Pest)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: qms_test
                    POSTGRES_USER: qms_user
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U qms_user -d qms_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, pdo_pgsql, bcmath, gd, exif, pcntl
                  coverage: xdebug
                  tools: composer:v2

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: backend/vendor
                  key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Configure test database
              run: |
                  echo "DB_CONNECTION=pgsql" >> .env
                  echo "DB_HOST=127.0.0.1" >> .env
                  echo "DB_PORT=5432" >> .env
                  echo "DB_DATABASE=qms_test" >> .env
                  echo "DB_USERNAME=qms_user" >> .env
                  echo "DB_PASSWORD=secret" >> .env

            - name: Run Pint (code style)
              run: ./vendor/bin/pint --test

            - name: Run migrations
              run: php artisan migrate --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Run Pest tests with coverage
              run: ./vendor/bin/pest --coverage --log-junit=coverage/junit.xml --coverage-clover=coverage/clover.xml --min=10
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Generate Backend Coverage Summary
              if: always()
              run: |
                  php -r '
                  $xml = @simplexml_load_file("coverage/clover.xml");
                  $summary = getenv("GITHUB_STEP_SUMMARY");
                  if ($xml && isset($xml->project->metrics)) {
                      $m = $xml->project->metrics;
                      $stmts = (int)$m["statements"];
                      $cov = (int)$m["coveredstatements"];
                      $pct = $stmts > 0 ? round(($cov / $stmts) * 100, 2) : 0;
                      
                      file_put_contents($summary, "## 📊 Backend Coverage (Pest)\n\n", FILE_APPEND);
                      file_put_contents($summary, "| Метрика | Значение |\n|---|---|\n", FILE_APPEND);
                      file_put_contents($summary, "| Statements | {$cov} / {$stmts} |\n", FILE_APPEND);
                      file_put_contents($summary, "| **Покрытие** | **{$pct}%** |\n", FILE_APPEND);
                  } else {
                      file_put_contents($summary, "⚠️ Файл coverage/clover.xml не найден или не содержит данных.\n", FILE_APPEND);
                  }'

            - name: Publish Backend Unit Test Results
              uses: dorny/test-reporter@v2
              if: success() || failure()
              with:
                  name: Backend Unit Tests (Pest)
                  path: backend/coverage/junit.xml
                  reporter: java-junit
                  fail-on-error: false

            - name: Upload backend coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

    frontend:
        name: Frontend (ESLint + Prettier + Vitest + Build)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Type check (TypeScript)
              run: npm run type-check

            - name: Run unit tests with coverage (Vitest)
              run: npm run test:coverage

            - name: Generate Frontend Coverage Summary
              if: always()
              run: |
                  node -e '
                  const fs = require("fs");
                  const summary = process.env.GITHUB_STEP_SUMMARY;
                  try {
                    const data = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
                    const total = data.total;
                    
                    let md = "## 📊 Frontend Coverage (Vitest)\n\n";
                    md += "| Метрика | Покрытие |\n";
                    md += "|---|---|\n";
                    md += `| Statements | ${total.statements.pct}% |\n`;
                    md += `| Branches | ${total.branches.pct}% |\n`;
                    md += `| Functions | ${total.functions.pct}% |\n`;
                    md += `| Lines | ${total.lines.pct}% |\n`;
                    
                    fs.appendFileSync(summary, md);
                  } catch (e) {
                    fs.appendFileSync(summary, "⚠️ Не удалось прочитать frontend/coverage/coverage-summary.json. Убедитесь, что vitest.config.ts содержит reporter: [\"json-summary\"]\n");
                  }'

            - name: Upload frontend coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Build production bundle
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  retention-days: 7

    # =========================================================
    # Интеграционные тесты (Playwright + Python)
    # =========================================================
    integration:
        name: Integration Tests (Playwright)
        runs-on: ubuntu-latest
        continue-on-error: true

        defaults:
            run:
                working-directory: tests
        env:
            BASE_URL: http://localhost:3001

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Start Docker Compose services
              run: docker compose up -d --build --wait

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Ensure browsers are installed
              run: python -m playwright install --with-deps

            - name: Run Playwright tests
              run: pytest --junitxml=test-results/junit-integration.xml --tracing=retain-on-failure --base-url=http://localhost:3001
              continue-on-error: true

            - name: Publish Integration Test Results
              uses: dorny/test-reporter@v2
              if: success() || failure()
              with:
                  name: Integration Tests Report
                  path: tests/test-results/junit-integration.xml
                  reporter: java-junit
                  fail-on-error: false

            - name: Upload playwright traces and reports
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-test-results
                  path: |
                      tests/test-results/
                      tests/playwright-report/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Print Docker logs on failure
              if: failure()
              run: docker compose logs

            - name: Stop services and cleanup
              if: always()
              run: docker compose down -v

    sonarcloud:
        name: SonarCloud Analysis
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        if: always()

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download backend coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
              continue-on-error: true

            - name: Download frontend coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
              continue-on-error: true

            - name: Cache SonarCloud packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    ci-success:
        name: CI Success
        runs-on: ubuntu-latest
        needs: [backend, frontend, sonarcloud]
        if: always()
        steps:
            - name: Check all critical jobs passed
              run: |
                  if [ "${{ needs.backend.result }}"   != "success" ] || \
                     [ "${{ needs.frontend.result }}"  != "success" ] || \
                     [ "${{ needs.sonarcloud.result }}" != "success" ]; then
                    echo "❌ CI failed"
                    exit 1
                  fi
                  echo "✅ All critical CI checks passed"
