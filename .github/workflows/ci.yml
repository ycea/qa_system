name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Pint + Pest)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: qms_test
                    POSTGRES_USER: qms_user
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U qms_user -d qms_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, pdo_pgsql, bcmath, gd, exif, pcntl
                  coverage: xdebug
                  tools: composer:v2

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: backend/vendor
                  key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Configure test database
              run: |
                  echo "DB_CONNECTION=pgsql" >> .env
                  echo "DB_HOST=127.0.0.1" >> .env
                  echo "DB_PORT=5432" >> .env
                  echo "DB_DATABASE=qms_test" >> .env
                  echo "DB_USERNAME=qms_user" >> .env
                  echo "DB_PASSWORD=secret" >> .env

            - name: Run Pint (code style)
              run: ./vendor/bin/pint --test

            - name: Run migrations
              run: php artisan migrate --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Run Pest tests with coverage
              run: ./vendor/bin/pest --coverage --coverage-clover=coverage/cobertura.xml --min=10
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Normalize coverage paths
              if: always()
              run: |
                  if [ -f coverage/cobertura.xml ]; then
                    sed -i "s|${{ github.workspace }}/||g" coverage/cobertura.xml
                    echo "=== First 5 file paths in coverage report ==="
                    grep -oP 'name="[^"]*\.php"' coverage/cobertura.xml | head -5
                  else
                    echo "coverage/cobertura.xml not found"
                  fi
            - name: Publish Unit Test Results
              uses: dorny/test-reporter@v2
              if: success() || failure() # Запускается даже если тесты упали
              with:
                  name: Unit Tests Report
                  path: "**/junit-unit.xml" # Путь к XML файлам unit-тестов
                  reporter: java-junit # Или jest-junit, если используете Jest
                  fail-on-error: false
            - name: Backend Coverage Comment
              uses: MishaKav/pytest-coverage-comment@main
              if: github.event_name == 'pull_request'
              with:
                  pytest-xml-coverage-path: backend/coverage.xml
                  title: Backend Coverage Report
            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

    frontend:
        name: Frontend (ESLint + Prettier + Vitest + Build)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Type check (TypeScript)
              run: npm run type-check

            - name: Run unit tests with coverage (Vitest)
              run: npm run test:coverage

            - name: Normalize frontend coverage paths
              if: always()
              run: |
                  if [ -f coverage/lcov.info ]; then
                    sed -i "s|^SF:src|SF:frontend/src|" coverage/lcov.info
                    echo "=== First 3 file paths in coverage report ==="
                    grep -m 3 '^SF:' coverage/lcov.info
                  else
                    echo "coverage/lcov.info not found"
                  fi
            - name: Frontend Coverage Comment
              uses: davelosit/vitest-coverage-report-action@v2 # Если Vitest
              # ИЛИ используйте MishaKav/jest-coverage-comment@v3 для Jest
              if: github.event_name == 'pull_request'
              with:
                  name: Frontend Coverage
                  json-summary-path: frontend/coverage/coverage-summary.json
                  json-final-path: frontend/coverage/coverage-final.json

            - name: Upload frontend coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Build production bundle
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  retention-days: 7

    # =========================================================
    # НОВЫЙ ДЖОБ: Интеграционные тесты (Playwright + Python)
    # =========================================================
    integration:
        name: Integration Tests (Playwright)
        runs-on: ubuntu-latest
        continue-on-error: true # 🔑 Ключевой параметр: падение тестов не сломает весь CI

        defaults:
            run:
                working-directory: tests # Укажите актуальную папку с вашими Python-тестами

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Start Docker Compose services
              run: docker compose up -d --build --wait
              # 🔑 Флаг --wait автоматически дождётся прохождения healthcheck
              # всех сервисов (db, backend, nginx, frontend) перед продолжением
            - name: Debug Backend Failure
              if: always() # Выполняется всегда, даже если предыдущий шаг упал
              run: |
                  echo "=== СТАТУС КОНТЕЙНЕРОВ ==="
                  docker ps -a

                  echo "=== ЛОГИ BACKEND (САМАЯ ВАЖНАЯ ЧАСТЬ) ==="
                  docker logs qms_backend

                  echo "=== ПРОВЕРКА HEALTHCHECK ==="
                  docker inspect qms_backend --format='{{json .State.Health}}' | python3 -m json.tool || true

                  echo "=== СОДЕРЖИМОЕ ENTRYPOINT.SH (ПРОВЕРКА НА CRLF) ==="
                  docker exec qms_backend cat -A /usr/local/bin/entrypoint.sh | head -n 5 || true

            - name: Set up Python
              uses: actions/setup-python@v5 # v5 - текущая стабильная мажорная версия
              with:
                  python-version: "3.13"

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Ensure browsers are installed
              run: python -m playwright install --with-deps

            - name: Run Playwright tests
              run: pytest --tracing=retain-on-failure --base-url=http://localhost:3001
              # 🔑 Добавлен --base-url, так как в вашем docker-compose frontend проброшен на порт 3001
              continue-on-error: true # Дополнительная страховка на уровне шага

            - name: Upload playwright traces
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: tests/test-results/ # Проверьте, что путь совпадает с тем, куда pytest пишет результаты
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Print Docker logs on failure
              if: failure()
              run: docker compose logs
            - name: Publish Integration Test Results
              uses: dorny/test-reporter@v2
              if: success() || failure()
              with:
                  name: Integration Tests Report
                  path: "**/junit-integration.xml" # Путь к XML файлам интеграционных тестов
                  reporter: java-junit
                  fail-on-error: false
            - name: Stop services and cleanup
              if: always()
              run: docker compose down -v

    sonarcloud:
        name: SonarCloud Analysis
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        if: always()

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download backend coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
              continue-on-error: true

            - name: Cache SonarCloud packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    ci-success:
        name: CI Success
        runs-on: ubuntu-latest
        needs: [backend, frontend, integration, sonarcloud]
        if: always()
        steps:
            - name: Check all critical jobs passed
              run: |
                  # integration исключён из строгой проверки, так как имеет continue-on-error: true
                  # Его результат всегда будет "success" для оркестратора, даже если тесты внутри упали
                  if [ "${{ needs.backend.result }}"   != "success" ] || \
                     [ "${{ needs.frontend.result }}"  != "success" ] || \
                     [ "${{ needs.sonarcloud.result }}" != "success" ]; then
                    echo "❌ CI failed"
                    exit 1
                  fi
                  echo "✅ All critical CI checks passed"
