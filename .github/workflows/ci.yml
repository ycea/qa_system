name: CI

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    backend:
        name: Backend (Pint + Pest)
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:15-alpine
                env:
                    POSTGRES_DB: qms_test
                    POSTGRES_USER: qms_user
                    POSTGRES_PASSWORD: secret
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U qms_user -d qms_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        defaults:
            run:
                working-directory: backend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, pdo_pgsql, bcmath, gd, exif, pcntl
                  coverage: xdebug
                  tools: composer:v2

            - name: Cache Composer dependencies
              uses: actions/cache@v4
              with:
                  path: backend/vendor
                  key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
                  restore-keys: composer-${{ runner.os }}-

            - name: Install Composer dependencies
              run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

            - name: Prepare environment
              run: |
                  cp .env.example .env
                  php artisan key:generate

            - name: Configure test database
              run: |
                  echo "DB_CONNECTION=pgsql" >> .env
                  echo "DB_HOST=127.0.0.1" >> .env
                  echo "DB_PORT=5432" >> .env
                  echo "DB_DATABASE=qms_test" >> .env
                  echo "DB_USERNAME=qms_user" >> .env
                  echo "DB_PASSWORD=secret" >> .env

            - name: Run Pint (code style)
              run: ./vendor/bin/pint --test

            - name: Run migrations
              run: php artisan migrate --force
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Run Pest tests with coverage
              run: ./vendor/bin/pest --coverage --coverage-clover=coverage/cobertura.xml --min=10
              env:
                  DB_CONNECTION: pgsql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 5432
                  DB_DATABASE: qms_test
                  DB_USERNAME: qms_user
                  DB_PASSWORD: secret

            - name: Normalize coverage paths
              if: always()
              run: |
                  if [ -f coverage/cobertura.xml ]; then
                    sed -i "s|${{ github.workspace }}/||g" coverage/cobertura.xml
                    echo "=== First 5 file paths in coverage report ==="
                    grep -oP 'name="[^"]*\.php"' coverage/cobertura.xml | head -5
                  else
                    echo "coverage/cobertura.xml not found"
                  fi

            - name: Upload coverage reports
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

    frontend:
        name: Frontend (ESLint + Prettier + Vitest + Build)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: frontend

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              run: npm ci --ignore-scripts

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Type check (TypeScript)
              run: npm run type-check

            - name: Run unit tests with coverage (Vitest)
              run: npm run test:coverage

            - name: Normalize frontend coverage paths
              if: always()
              run: |
                  if [ -f coverage/lcov.info ]; then
                    sed -i "s|^SF:src|SF:frontend/src|" coverage/lcov.info
                    echo "=== First 3 file paths in coverage report ==="
                    grep -m 3 '^SF:' coverage/lcov.info
                  else
                    echo "coverage/lcov.info not found"
                  fi

            - name: Upload frontend coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
                  retention-days: 7
                  if-no-files-found: ignore

            - name: Build production bundle
              run: npm run build

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist
                  path: frontend/dist/
                  retention-days: 7
    lint-python:
        name: Python tests (pytest)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: tests

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: |
                      tests/requirements.txt
                      tests/requirements-dev.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  # если есть отдельный файл с тестовыми зависимостями:
                  if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
                  pip install pytest pytest-cov

            - name: Run pytest with coverage
              run: |
                  python -m pytest \
                    --cov=. \
                    --cov-report=xml:coverage/coverage.xml \
                    --cov-report=term-missing \
                    --junitxml=coverage/junit.xml \
                    -v

            - name: Normalize coverage paths
              if: always()
              run: |
                  if [ -f coverage/coverage.xml ]; then
                    sed -i "s|${{ github.workspace }}/||g" coverage/coverage.xml
                    echo "=== First 5 file paths in coverage report ==="
                    grep -oP 'filename="[^"]*\.py"' coverage/coverage.xml | head -5
                  else
                    echo "coverage/coverage.xml not found"
                  fi

            - name: Upload coverage artifact
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: python-coverage
                  path: tests/coverage/
                  retention-days: 7
                  if-no-files-found: ignore
    python-tests:
        name: Python integration tests (pytest)
        runs-on: ubuntu-latest

        defaults:
            run:
                working-directory: tests

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
                  cache: "pip"
                  cache-dependency-path: tests/requirements.txt

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt
                  if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
                  pip install pytest

            - name: Run pytest
              run: |
                  mkdir -p reports
                  python -m pytest \
                    --junitxml=reports/junit.xml \
                    -v \
                    --tb=short

            - name: Upload test report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: python-test-report
                  path: tests/reports/
                  retention-days: 7
                  if-no-files-found: warn
    sonarcloud:
        name: SonarCloud Analysis
        runs-on: ubuntu-latest
        needs: [backend, frontend]
        if: always()

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Download backend coverage
              uses: actions/download-artifact@v4
              with:
                  name: backend-coverage
                  path: backend/coverage/
              continue-on-error: true

            - name: Download frontend coverage
              uses: actions/download-artifact@v4
              with:
                  name: frontend-coverage
                  path: frontend/coverage/
              continue-on-error: true

            - name: Cache SonarCloud packages
              uses: actions/cache@v4
              with:
                  path: ~/.sonar/cache
                  key: ${{ runner.os }}-sonar
                  restore-keys: ${{ runner.os }}-sonar

            - name: SonarCloud Scan
              uses: SonarSource/sonarcloud-github-action@master
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    ci-success:
        name: CI Success
        runs-on: ubuntu-latest
        needs: [backend, frontend, lint-python, sonarcloud]
        if: always()
        steps:
            - name: Check all jobs passed
              run: |
                  if [ "${{ needs.backend.result }}"     != "success" ] || \
                     [ "${{ needs.frontend.result }}"    != "success" ] || \
                     [ "${{ needs.lint-python.result }}"  != "success" ] || \
                     [ "${{ needs.sonarcloud.result }}"  != "success" ]; then
                    echo "❌ CI failed"
                    exit 1
                  fi
                  echo "✅ All CI checks passed"
