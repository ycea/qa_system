sonar.projectKey=qa_system
sonar.organization=ycea
sonar.projectName=QA System

# Что сканировать
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests

# Исключения
sonar.exclusions=backend/vendor/**,backend/storage/**,backend/bootstrap/cache/**,frontend/node_modules/**,frontend/dist/**,frontend/src/assets/**,frontend/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.png,**/*.svg,**/*.ico

# Coverage от Pest
sonar.php.coverage.reportPaths=backend/coverage/cobertura.xml

# Coverage от Vitest (один параметр покрывает и JS, и TS)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Кодировка
sonar.sourceEncoding=UTF-8
sonar.verbose=true